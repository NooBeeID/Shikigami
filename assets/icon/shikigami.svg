<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262338"/>
      <stop offset="1" stop-color="#14141b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3dccd"/>
      <stop offset="0.5" stop-color="#fbf7ef"/>
      <stop offset="1" stop-color="#e3dccd"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <circle cx="512" cy="500" r="380" fill="url(#glow)"/>
  <!-- ofuda: jimat kertas berujung belah -->
  <g transform="rotate(-6 512 512)">
    <g filter="url(#shadow)">
      <path d="M372 150 H652 V830 L512 760 L372 830 Z" fill="url(#paper)"/>
    </g>
    <path d="M392 190 V780 L512 722 L632 780 V190" fill="none" stroke="#7c5cff" stroke-opacity="0.55" stroke-width="5" stroke-linejoin="round"/>
    <rect x="372" y="150" width="280" height="40" fill="#7c5cff"/>
    <!-- segel dengan prompt terminal -->
    <rect x="422" y="260" width="180" height="180" rx="26" fill="#7c5cff"/>
    <polyline points="468,312 520,350 468,388" fill="none" stroke="#fbf7ef" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="538" y1="398" x2="572" y2="398" stroke="#fbf7ef" stroke-width="22" stroke-linecap="round"/>
    <!-- goresan tulisan tangan -->
    <g fill="#3b3560">
      <rect x="474" y="490" width="76" height="14" rx="7"/>
      <rect x="494" y="520" width="34" height="14" rx="7"/>
      <rect x="466" y="550" width="92" height="14" rx="7"/>
      <rect x="486" y="580" width="52" height="14" rx="7"/>
      <rect x="474" y="610" width="76" height="14" rx="7"/>
      <rect x="494" y="640" width="34" height="14" rx="7"/>
    </g>
  </g>
</svg>
